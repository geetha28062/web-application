<!DOCTYPE html>
<html>
<head>
    <title>Science Exhibition</title>

    <style>
        body {
            background-color: #e8f5e9;
            font-family: Arial;
        }

        h1 {
            color: #00695c;
            text-align: center;
            font-size: 40px;
        }

        h2 {
            color: #1565c0;
        }

        p {
            color: #333333;
            font-size: 18px;
        }

        .event {
            background-color: white;
            width: 650px;
            margin: 30px auto;
            padding: 25px;
            border: 3px solid #009688;
            border-radius: 12px;
        }

        .date {
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="event">

        <h1>Science Exhibition</h1>

        <h2>About the Event</h2>

        <p>
            Our college is organizing a <b>Science Exhibition</b>
            to encourage students to explore science and technology.
        </p>

        <h2>Projects</h2>

        <p>• Solar Energy Model</p>
        <p>• Water Purification System</p>
        <p>• Smart Agriculture</p>
        <p>• Robotics Project</p>

        <p class="date">
            Date: 15th October
        </p>

    </div>

</body>
</html>
