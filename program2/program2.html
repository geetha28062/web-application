
<!DOCTYPE html>
<html>
<head>
    <title>Styled Button</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightyellow;
        }
        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
        }
        button:hover {
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>My Web Application</h1>
    <p>Click the button below.</p>
    <button>Click Me</button>
</body>
</html>
