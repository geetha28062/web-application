
<!DOCTYPE html>
<html>
<head>
    <title>Box Layout</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
        }
        .box {
            background-color: white;
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid blue;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>My Profile</h2>
        <p>Name: Geetha</p>
        <p>Course: Computer Science</p>
    </div>
</body>
</html>
