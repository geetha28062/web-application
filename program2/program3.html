
<!DOCTYPE html>
<html>
<head>
    <title>Font Styles</title>
    <style>
        h1 {
            font-family: Georgia;
            color: purple;
        }
        p {
            font-family: Arial;
            font-size: 18px;
        }
        .text {
            font-style: italic;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Font Demonstration</h1>
    <p>This is normal text.</p>
    <p class="text">This is bold and italic text.</p>
</body>
</html>
