<!DOCTYPE html>
<html>
<head>
    <title>Attendance Tracker</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            text-align: center;
            padding: 40px;
        }

        .card {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px gray;
        }

        h1 {
            color: #0284c7;
        }

        .status {
            font-size: 25px;
            font-weight: bold;
            color: #0284c7;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #0284c7;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function Attendance(props) {

    const [days, setDays] = React.useState(0);

    function present() {
        setDays(days + 1);
    }

    function absent() {
        if (days > 0) {
            setDays(days - 1);
        }
    }

    function reset() {
        setDays(0);
    }

    return (
        <div className="card">

            <h2>Student Attendance</h2>

            <p><b>Name:</b> {props.name}</p>
            <p><b>Class:</b> {props.className}</p>

            <hr />

            <p>Present Days</p>

            <p className="status">{days}</p>

            <button onClick={present}>
                Present
            </button>

            <button onClick={absent}>
                Remove
            </button>

            <button onClick={reset}>
                Reset
            </button>

        </div>
    );
}

function App() {
    return (
        <div>

            <h1>Attendance Tracker</h1>

            <Attendance
                name="dhanu"
                className="MSC - I Year"
            />

        </div>
    );
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
