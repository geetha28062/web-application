<!DOCTYPE html>
<html>
<head>
    <title>React Props, State and Event Handling</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 10px;
            margin: 5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        // Counter component using State
        function Counter() {
            const [count, setCount] = React.useState(0);

            return (
                <div className="card">
                    <h3>Counter</h3>
                    <h2>{count}</h2>

                    <button onClick={() => setCount(count + 1)}>
                        Increase
                    </button>

                    <button onClick={() => setCount(count - 1)}>
                        Decrease
                    </button>

                    <button onClick={() => setCount(0)}>
                        Reset
                    </button>
                </div>
            );
        }

        // Student component using Props
        function Student(props) {
            return (
                <div className="card">
                    <h3>Student Information</h3>
                    <p>Name: {props.name}</p>
                    <p>Department: {props.department}</p>
                    <p>Year: {props.year}</p>
                </div>
            );
        }

        // Main App component
        function App() {
            return (
                <div>
                    <h2>React Props, State and Event Handling</h2>

                    <Student
                        name="John"
                        department="Computer Science"
                        year="3rd Year"
                    />

                    <Counter />
                </div>
            );
        }

        // Render React application
        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>
</body>
</html>
