<!DOCTYPE html>
<html>
<head>
    <title>React To-Do List</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f2f5f9;
        }

        .app {
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            width: 350px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            margin: 5px;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        li {
            margin: 10px;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function TodoList() {

    const [task, setTask] = React.useState("");
    const [tasks, setTasks] = React.useState([]);

    function addTask() {
        if (task !== "") {
            setTasks([...tasks, task]);
            setTask("");
        }
    }

    return (
        <div className="card">

            <h2>To-Do List</h2>

            <input
                value={task}
                placeholder="Enter task"
                onChange={(e) => setTask(e.target.value)}
            />

            <button onClick={addTask}>
                Add
            </button>

            <ul>
                {tasks.map((item, index) => (
                    <li key={index}>{item}</li>
                ))}
            </ul>

        </div>
    );
}

function App() {

    return (
        <div className="app">

            <h1>React To-Do Application</h1>

            <p>Add your daily tasks</p>

            <TodoList />

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
