<!DOCTYPE html>
<html>
<head>
    <title>React Temperature Converter</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #fff7ed;
        }

        .app {
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            width: 350px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            margin: 15px;
            padding: 10px 20px;
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .result {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function TemperatureConverter() {

    const [celsius, setCelsius] = React.useState("");
    const [fahrenheit, setFahrenheit] = React.useState("");

    function convert() {

        const result =
            (parseFloat(celsius) * 9 / 5) + 32;

        setFahrenheit(result.toFixed(2));
    }

    return (
        <div className="card">

            <h2>Temperature Converter</h2>

            <input
                type="number"
                placeholder="Enter Celsius"
                value={celsius}
                onChange={(e) => setCelsius(e.target.value)}
            />

            <br />

            <button onClick={convert}>
                Convert
            </button>

            <p className="result">
                Fahrenheit: {fahrenheit}
            </p>

        </div>
    );
}

function App() {

    return (
        <div className="app">

            <h1>React Temperature Converter</h1>

            <p>Convert Celsius to Fahrenheit</p>

            <TemperatureConverter />

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
